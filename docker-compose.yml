version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: genkit_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Admin@123
      MYSQL_DATABASE: genkit_chatbot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: genkit_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=Admin@123
      - MYSQL_DATABASE=genkit_chatbot
    depends_on:
      - mysql

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: genkit_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
